<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0058F8" />
        <title>Sin conexión · Retazo</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
            }
            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ffffff;
                color: #0f172a;
                text-align: center;
                padding: 24px;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0a0a0a;
                    color: #f8fafc;
                }
            }
            img {
                width: 120px;
            }
            h1 {
                font-size: 1.4rem;
                margin: 16px 0 8px;
            }
            p {
                color: #64748b;
                margin: 0 0 24px;
            }
            button {
                background: #0058f8;
                color: #fff;
                border: 0;
                border-radius: 12px;
                padding: 12px 24px;
                font-size: 1rem;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/images/logo-icon.png" alt="Retazo" />
            <h1>Sin conexión</h1>
            <p>Revisa tu internet para ver los marcadores al día.</p>
            <button type="button" onclick="location.reload()">
                Reintentar
            </button>
        </main>
    </body>
</html>
